coverage:
    status:
        project:
            default:
                target: auto
                threshold: 1%
        patch:
            default:
                target: 80%
                threshold: 5%

comment:
    layout: 'reach, diff, flags, files'
    behavior: default
    require_changes: false

ignore:
    - 'src/**/*.test.ts'
    - 'src/test/**'
    - 'src/popup/index.ts'
    - 'src/options/index.ts'
    - 'src/background/index.ts'
