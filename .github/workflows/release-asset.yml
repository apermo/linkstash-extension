name: Release Asset

on:
    release:
        types: [created, published]
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to build and attach the zip to (e.g. v0.1.0)'
                required: true
                type: string

jobs:
    upload:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Resolve tag
              id: tag
              run: |
                  if [ -n "${{ github.event.inputs.tag }}" ]; then
                      echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
                  elif [ -n "${{ github.event.release.tag_name }}" ]; then
                      echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.tag.outputs.name }}
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - name: Package dist as zip
              run: |
                  cd dist
                  zip -r "../linkstash-extension-${{ steps.tag.outputs.name }}.zip" .
            # The `push: tags: ['v*']` trigger can fire before the
            # GitHub Release record exists (the release-cutter job in
            # the upstream reusable workflow may still be running when
            # the tag lands). Wait up to 5 minutes for it before
            # attempting to upload, otherwise `gh release upload`
            # fails with "release not found".
            - name: Wait for the GitHub Release to exist
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.name }}
              run: |
                  for i in $(seq 1 30); do
                      if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                          echo "Release $TAG present after $((i * 10))s."
                          exit 0
                      fi
                      sleep 10
                  done
                  echo "Release $TAG never appeared after 5 minutes — bailing." >&2
                  exit 1
            - name: Upload asset to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ steps.tag.outputs.name }}" \
                      "linkstash-extension-${{ steps.tag.outputs.name }}.zip" \
                      --clobber
