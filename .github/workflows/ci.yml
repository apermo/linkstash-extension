name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
    push:
        branches:
            - main

jobs:
    pr-validation:
        if: github.event_name == 'pull_request'
        uses: apermo/reusable-workflows/.github/workflows/reusable-pr-validation.yml@main
        permissions:
            contents: read
            pull-requests: write
    conventional-commits:
        uses: apermo/reusable-workflows/.github/workflows/reusable-conventional-commits.yml@main
    build:
        name: Lint, test, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint
            - run: npm run test:coverage
            - run: npm run build
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: coverage/lcov.info
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 14
    release:
        if: github.event_name == 'push'
        uses: apermo/reusable-workflows/.github/workflows/reusable-release.yml@main
        permissions:
            contents: write
            pull-requests: write
